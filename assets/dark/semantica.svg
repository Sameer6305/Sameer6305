<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230">
  <rect width="800" height="230" fill="#0E0E0E"/>
  <rect x="20" y="10" width="760" height="210" fill="#161412" stroke="#3A3835" stroke-width="1"/>
  <line x1="20" y1="10" x2="780" y2="10" stroke="#9C9791" stroke-width="1.5"/>
  <text x="36" y="36" font-family="'Courier New', Courier, monospace" font-size="16" letter-spacing="4" font-weight="700" fill="#E8E4DC">SEMANTICA</text>
  <rect x="166" y="22" width="116" height="16" fill="#0E0E0E" stroke="#9C9791" stroke-width="1" rx="2"/>
  <text x="174" y="33" font-family="'Courier New', Courier, monospace" font-size="9" letter-spacing="2" fill="#9C9791">BUILDING NOW</text>
  <text x="36" y="54" font-family="'Courier New', Courier, monospace" font-size="10" letter-spacing="1" fill="#6A6560">AI Systems &amp; Backend Engineering</text>
  <line x1="36" y1="62" x2="764" y2="62" stroke="#2A2825" stroke-width="1"/>
  <text x="36" y="80" font-family="'Courier New', Courier, monospace" font-size="11" fill="#E8E4DC">Semantic data and knowledge infrastructure for AI systems that need to be</text>
  <text x="36" y="96" font-family="'Courier New', Courier, monospace" font-size="11" fill="#E8E4DC">explainable and auditable — not just fluent. A knowledge graph engine,</text>
  <text x="36" y="112" font-family="'Courier New', Courier, monospace" font-size="11" fill="#E8E4DC">retrieval framework, and semantic layer built to close the gap between</text>
  <text x="36" y="128" font-family="'Courier New', Courier, monospace" font-size="11" fill="#E8E4DC">language models and structured, verifiable knowledge.</text>
  <text x="36" y="150" font-family="'Courier New', Courier, monospace" font-size="9" letter-spacing="2" fill="#9C9791">SCOPE OF WORK</text>
  <text x="36" y="166" font-family="'Courier New', Courier, monospace" font-size="10" fill="#4A4745">Backend infrastructure</text>
  <text x="220" y="166" font-family="'Courier New', Courier, monospace" font-size="10" fill="#4A4745">Data ingestion / retrieval</text>
  <text x="420" y="166" font-family="'Courier New', Courier, monospace" font-size="10" fill="#4A4745">Knowledge graph architecture</text>
  <text x="36" y="182" font-family="'Courier New', Courier, monospace" font-size="10" fill="#4A4745">MCP server / CLI tooling</text>
  <text x="220" y="182" font-family="'Courier New', Courier, monospace" font-size="10" fill="#4A4745">Integrations / developer tooling</text>
  <text x="420" y="182" font-family="'Courier New', Courier, monospace" font-size="10" fill="#4A4745">Testing · code review · production</text>
  <text x="36" y="206" font-family="'Courier New', Courier, monospace" font-size="10" letter-spacing="1" fill="#9C9791">semantica-agi/semantica</text>
  <text x="218" y="206" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6A6560">·</text>
  <text x="228" y="206" font-family="'Courier New', Courier, monospace" font-size="10" letter-spacing="1" fill="#9C9791">getsemantica.ai</text>
</svg>