<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 166" width="800" height="166">
  <rect width="800" height="166" fill="#0E0E0E"/>
  <rect x="20" y="14" width="2" height="124" fill="#9C9791" opacity="0.5"/>
  <text x="32" y="26" font-family="'Courier New', Courier, monospace" font-size="9" letter-spacing="2" fill="#9C9791">PROGRESSION · BACKEND → AI INFRASTRUCTURE → OPEN SOURCE</text>
  <text x="32" y="42" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E8E4DC">My engineering work started in backend systems — services, APIs,</text>
  <text x="32" y="62" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E8E4DC">and data pipelines — and has moved steadily toward AI infrastructure:</text>
  <text x="32" y="82" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E8E4DC">retrieval pipelines, knowledge graphs, and semantic layers that let AI</text>
  <text x="32" y="102" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E8E4DC">systems reason over structured knowledge rather than generating</text>
  <text x="32" y="122" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E8E4DC">plausible text. Most of that work now happens in the open,</text>
  <text x="32" y="142" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E8E4DC">on infrastructure other engineers rely on.</text>
  <line x1="20" y1="164" x2="780" y2="164" stroke="#2A2825" stroke-width="1"/>
</svg>