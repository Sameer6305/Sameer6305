<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 166" width="800" height="166">
  <rect width="800" height="166" fill="#F6F6F4"/>
  <rect x="20" y="14" width="2" height="124" fill="#7A7673" opacity="0.5"/>
  <text x="32" y="26" font-family="'Courier New', Courier, monospace" font-size="9" letter-spacing="2" fill="#7A7673">PROGRESSION · BACKEND → AI INFRASTRUCTURE → OPEN SOURCE</text>
  <text x="32" y="42" font-family="'Courier New', Courier, monospace" font-size="13" fill="#1A1816">My engineering work started in backend systems — services, APIs,</text>
  <text x="32" y="62" font-family="'Courier New', Courier, monospace" font-size="13" fill="#1A1816">and data pipelines — and has moved steadily toward AI infrastructure:</text>
  <text x="32" y="82" font-family="'Courier New', Courier, monospace" font-size="13" fill="#1A1816">retrieval pipelines, knowledge graphs, and semantic layers that let AI</text>
  <text x="32" y="102" font-family="'Courier New', Courier, monospace" font-size="13" fill="#1A1816">systems reason over structured knowledge rather than generating</text>
  <text x="32" y="122" font-family="'Courier New', Courier, monospace" font-size="13" fill="#1A1816">plausible text. Most of that work now happens in the open,</text>
  <text x="32" y="142" font-family="'Courier New', Courier, monospace" font-size="13" fill="#1A1816">on infrastructure other engineers rely on.</text>
  <line x1="20" y1="164" x2="780" y2="164" stroke="#DEDAD5" stroke-width="1"/>
</svg>